<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PYPL2MP3{% endblock %}</title>
    <script src="/static/htmx.min.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 60rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { font-size: 1.4rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 0.4rem 0.6rem; }
      tbody tr:nth-child(odd) { background: rgba(127, 127, 127, 0.08); }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .id { font-family: ui-monospace, monospace; font-size: 0.85em;
            opacity: 0.7; }
      .junk { color: #b26a00; }
      .job { font-size: 0.85em; min-height: 1.2em; }
      .job-running { opacity: 0.7; }
      .job-new { color: #0a7d3f; font-weight: 600; }
      .job-none { opacity: 0.6; }
      .job-error { color: #b00020; }
      .htmx-request .job, .htmx-request.job { opacity: 0.5; }
    </style>
  </head>
  <body>
    <h1>{% block heading %}PYPL2MP3{% endblock %}</h1>
    {% block content %}{% endblock %}
  </body>
</html>
