<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PYPL2MP3</title>
    {# Resolved before the first paint, so the page never shows one
       theme on its way to the other. console.js loads at the end of the
       body, far too late for that. #}
    <script>
      (function () {
        var stored = localStorage.getItem("pypl2mp3.theme") || "auto";
        var dark = stored === "dark" || (stored === "auto" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themeChoice = stored;
      })();
    </script>
    <script src="/static/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/console.css">
  </head>
  <body>
    {# data-swap-region marks a region whose contents may be replaced by a
       fragment. It is the layout's contract with itself: the <audio>
       element must never end up inside one, or a swap would recreate it
       and cut the sound. A test reads these attributes, so declaring a
       new region is enough to have the rule enforced on it. #}

    {# Deliberately not a swap region: it holds the job ribbon, and a
       running import must survive everything else on the page. #}
    <header id="header">
      <strong class="brand">PYPL<span>2</span>MP3</strong>

      {# One form holds the whole query. Everything that narrows the
         listing — the search box, the junk flag, the playlist picked in
         the nav — is a field of it, so the three can never drift apart.

         keyup filters as you type; `changed` keeps arrow keys and
         modifiers from refetching an unchanged query. The form still
         submits, so pressing enter is not a dead end. #}
      {# hx-indicator on the listing itself: a filter keystroke costs
         300ms of settling plus about 280ms of fetching and laying out
         944 rows, so for over half a second the old list sits there
         looking like the answer. Dimming it says the answer is on its
         way. Measured, and measured against the alternative —
         content-visibility on the rows made the layout slower, not
         faster, so it is not here. #}
      <form id="filters"
            hx-get="/fragments/list"
            hx-target="#list"
            hx-indicator="#list"
            hx-trigger="submit, change, keyup changed delay:300ms">
        <input type="hidden" name="playlist" id="playlist-field"
               value="{{ playlist }}">
        <input type="hidden" name="artist" id="artist-field"
               value="{{ artist }}">
        <input type="search" name="q" value="{{ query }}"
               placeholder="Filter by artist or title">
        <label>
          <input type="checkbox" name="junk" value="1"
                 {% if junk_only %}checked{% endif %}> Junk songs only
        </label>
        <button type="submit">Filter</button>
      </form>

      {# Three settings, not two: following the system is a preference
         in its own right, and a two-state toggle silently drops it. #}
      <div id="theme" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="auto">Auto</button>
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="dark">Dark</button>
      </div>

      {# The whole repository, whatever is filtered below. The toolbar
         counts the selection, so when the two differ they have to say
         which is which — hence "in library", and hence the toolbar
         saying "8 of 944" rather than a bare 8.

         The junk figure is a button because it was already coloured like
         one: an orange number that did nothing, beside a checkbox that
         did exactly the thing it looked like it offered. #}
      <span id="counts" data-total="{{ total_songs }}">
        {{ total_songs }} in library &middot;
        <button type="button" id="junk-count" class="junk"
                title="Show only the junk songs"
        >{{ total_junk }} junk</button>
      </span>

      {# Started jobs are appended here and poll themselves. They live in
         the header rather than beside the button that started them, so
         changing playlist — which rebuilds the nav — cannot take a
         running import off the screen. #}
      <div id="jobs"></div>

      {# Sink for requests whose answer is not displayed: the
         prefetches, and the workbench's save. #}
      <div id="prefetch" hidden></div>
    </header>

    {# Rebuilt when the playlist changes, and when a save changes what
       the repository holds: fixing a junk song gives it a real artist,
       which belongs in the presets. Both were once too expensive to do
       on a save; the parsed-song cache made a rebuild cost about 40ms. #}
    {# One column: the song you are looking at, and the songs you could
       look at instead. The inspector takes only the height it needs, so
       with nothing selected the listing has the whole column.

       Not a swap region itself — it only holds two. #}
    <div id="main">
      <section id="inspector" data-swap-region>
        <p class="job-none">Select a song.</p>
      </section>

      {# Under the song it is playing, not at the foot of the page: the
       inspector follows the queue, so the art, the tags and the
       transport all describe the same track. Still not a swap region,
       and still not inside one — that rule is what keeps the sound
       running through every refresh.

         Its transport is drawn here rather than by the browser: <audio
         controls> renders a large rounded pill no stylesheet can reach,
         and it was the one shape on the page that belonged to nobody's
         design. The element stays; its chrome does not. #}
      <footer id="player" class="idle">
        <div id="transport">
          <button type="button" data-player-action="previous"
                  title="Previous (left arrow)"
                  aria-label="Previous">&#9198;</button>
          <button type="button" data-player-action="toggle"
                  title="Play / pause (space)"
                  aria-label="Play or pause">&#9654;</button>
          <button type="button" data-player-action="next"
                  title="Next (right arrow)" aria-label="Next">&#9197;</button>
        </div>

        {# The volume, between the transport and the timeline.

           It sat at the far end first, on the argument that the
           transport means movement through the queue — that is what the
           lit arrow on it says — and a level is not a movement. Moved
           here on request: the four things you reach for while listening
           are now in one place, and the picture keeps the whole of the
           rest of the row. What the argument protected is protected by
           `flex: 0 0 auto`, not by the position.

           Drawn, like #seek and for the same reason: a range input is
           one of the shapes in a browser no stylesheet can reach. Same
           role, same attributes, same keyboard.

           The speaker is the mute switch, not a label — a button
           element, because the click has to reach a keyboard and a
           screen reader, but with none of a button's frame: the icon
           alone. Its icon is two paths so muting can swap the waves for
           a cross without reaching for a second glyph — and an inline
           icon rather than an emoji because 🔊 carries its own colour in
           every browser that has it, which is the one thing this row
           cannot use. #}
        <div id="volume">
          <button type="button" id="volume-mute" aria-pressed="false"
                  title="Mute" aria-label="Mute">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"
                 fill="none" stroke="currentColor" stroke-width="1.4"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 6h2.4L8 3v10L4.4 10H2z"/>
              <path class="waves" d="M10.6 5.9a3 3 0 0 1 0 4.2"/>
              <path class="waves" d="M12.6 4a5.6 5.6 0 0 1 0 8"/>
              <path class="crossed" d="M10.8 6.2l4 3.6M14.8 6.2l-4 3.6"/>
            </svg>
          </button>
          <div id="volume-track" role="slider" aria-label="Volume"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
               aria-valuetext="100%" tabindex="0">
            <span class="track"></span>
            <span class="fill"></span>
          </div>
        </div>

        <div id="timeline">
          <span class="t" id="player-elapsed">0:00</span>
          {# The waveform is drawn inside the slider, not in place of it:
             every seek gesture — the click, the drag, the arrow keys —
             is bound to #seek and measured from its box, so the picture
             can change without any of that being rewritten.

             The plain bar underneath is what shows while the peaks are
             being fetched, and what stays if they never arrive. The
             canvas is decoration over a control that already works; it
             is hidden from assistive technology for the same reason. #}
          <div id="seek" role="slider" aria-label="Seek"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
               tabindex="0">
            <span class="track"></span>
            <span class="fill"></span>
            <canvas id="waveform" aria-hidden="true"></canvas>
          </div>
          <span class="t" id="player-total">0:00</span>
        </div>

        <audio id="audio"></audio>
      </footer>

      {# Two views of the same column. The playlist is what you listen
         to; imports are what you are adding to it. They are tabs rather
         than one scrolling page because an import runs for minutes and
         must not push the listing off the screen — and rather than a
         separate page because leaving this one would stop the music.

         Switching is client-side: both panes are already in the
         document, and a round trip to change which one is visible would
         be a round trip to show what the browser already holds. #}
      <div id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="playlist"
                aria-selected="true">Playlist</button>
        <button type="button" role="tab" data-tab="imports"
                aria-selected="false">Imports<span id="imports-badge"></span>
        </button>
      </div>

      {# Where you are in the queue, what comes next, and what to do
         with the selection — all of it about the queue, none of it from
         the server. Outside #list on purpose: a refetch would otherwise
         wipe the player's readout and paint it back blank. #}
      <div id="toolbar">
        <span id="player-position"></span>
        <span id="player-next"><span class="k" id="player-next-key">NEXT</span
          ><span id="player-next-text">Nothing playing</span
          ><span id="player-next-time"></span></span>
        {# Inline SVG rather than glyphs. ⤨ and ⚒ exist in Unicode but
           not in every system font, and where they do they render at
           whatever size that font decided — which was too small to
           read. These follow the text colour and the text size. #}
        <button type="button" data-queue-action="play">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="currentColor"><path d="M5 3.2 13 8l-8 4.8Z"/></svg>
          Play all
        </button>
        <button type="button" data-queue-action="shuffle"
                aria-pressed="false"
                title="Play this selection in a random order">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 4h3l7 8h3M1.5 12h3l7-8h3"/>
            <path d="M11.8 1.8 14.5 4l-2.7 2.2"/>
            <path d="M11.8 9.8 14.5 12l-2.7 2.2"/>
          </svg>
          Shuffle
        </button>
        <button type="button" data-queue-action="workbench"
                title="Judge this selection one song at a time">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.6 1.8H2.2v6.4l6 6 6.4-6.4z"/>
            <circle cx="5.2" cy="5.2" r="1.1"/>
          </svg>
          Workbench
        </button>
      </div>

      {# songsChanged fires when a save changed what the repository
         holds. The listing refetches with the current filters, because a
         fixed junk song must leave a junk-filtered view rather than sit
         there looking repaired. #}
      <main id="list" data-swap-region
            hx-get="/fragments/list"
            hx-trigger="songsChanged from:body"
            hx-include="#filters">{% include "_list.html" %}</main>

      {# The other pane. It polls while a check or an import is running
         and stops on its own the moment neither is — same rule as every
         other self-polling fragment here: the returned markup simply
         carries no hx-trigger. #}
      <section id="imports" data-swap-region
               hx-get="/fragments/imports"
               hx-trigger="playlistChanged from:body, importsChanged from:body"
               hx-include="#filters">{% include "_imports.html" %}</section>
    </div>

    <nav id="nav" data-swap-region
         hx-get="/fragments/nav"
         hx-trigger="playlistChanged from:body, songsChanged from:body"
         hx-include="#filters">{% include "_nav.html" %}</nav>


    <script src="/static/console.js"></script>
  </body>
</html>
